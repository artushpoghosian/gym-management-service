name: gym-microservices

networks:
  gym-net:
    driver: bridge

volumes:
  pgdata:
  mongodata:

services:
  postgres:
    image: postgres:16-alpine
    container_name: gym-postgres
    environment:
      POSTGRES_DB: gymdb
      POSTGRES_USER: gym
      POSTGRES_PASSWORD: gym
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - gym-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gym -d gymdb"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:7
    container_name: gym-mongo
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  activemq:
    image: apache/activemq-classic:latest
    container_name: gym-activemq
    ports:
      - "61616:61616"
      - "8161:8161"
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "bash", "-c", "echo > /dev/tcp/localhost/61616"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  eureka-server:
    image: gym/eureka-server:latest
    build:
      context: .
      dockerfile: eureka-server/Dockerfile
    container_name: eureka-server
    ports:
      - "8761:8761"
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8761/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  trainer-workload-service:
    image: gym/trainer-workload-service:latest
    build:
      context: .
      dockerfile: trainer-workload-service/Dockerfile
    container_name: trainer-workload-service
    depends_on:
      eureka-server:
        condition: service_healthy
      activemq:
        condition: service_healthy
      mongo:
        condition: service_healthy
    environment:
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP: "true"
      ACTIVEMQ_BROKER_URL: ${ACTIVEMQ_BROKER_URL}
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      MONGODB_URI: mongodb://mongo:27017/trainer_workload
    ports:
      - "8082:8082"
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "bash", "-c", "curl -s -o /dev/null -w '%{http_code}' http://localhost:8082/actuator/health | grep -q 401"]
      # 30s, not 10s: every probe hits the REST path, and TransactionIdFilter logs a
      # [TX-START]/[TX-END] pair for it — a 10s interval buries the [MQ] lines.
      interval: 30s
      timeout: 3s
      retries: 10
      start_period: 20s

  gym-management-service:
    image: gym/gym-management-service:latest
    build:
      context: .
      dockerfile: gym-main-service/Dockerfile
    container_name: gym-management-service
    depends_on:
      eureka-server:
        condition: service_healthy
      postgres:
        condition: service_healthy
      activemq:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRATION_MS: ${JWT_EXPIRATION_MS:-3600000}
      EUREKA_URL: http://eureka-server:8761/eureka/
      EUREKA_PREFER_IP: "true"
      ACTIVEMQ_BROKER_URL: ${ACTIVEMQ_BROKER_URL}
      ACTIVEMQ_USER: ${ACTIVEMQ_USER}
      ACTIVEMQ_PASSWORD: ${ACTIVEMQ_PASSWORD}
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_NAME: gymdb
      DB_USERNAME: gym
      DB_PASSWORD: gym
    ports:
      - "8080:8080"
    networks:
      - gym-net
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s
